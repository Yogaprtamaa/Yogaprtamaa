name: Generate Snake Animation

on:
  # update otomatis tiap 12 jam
  schedule:
    - cron: "0 */12 * * *"
  # bisa di-trigger manual dari tab Actions
  workflow_dispatch:
  # regenerate tiap push ke main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVG (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF3CAC&color_dots=#161b22,#FFE50033,#FFE50088,#FFE500,#FF3CAC

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
