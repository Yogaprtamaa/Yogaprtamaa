name: Generate Snake Animation

on:
  # auto-update every 12 hours so it stays in sync with your commits
  schedule:
    - cron: "0 */12 * * *"
  # allow manual trigger from the Actions tab
  workflow_dispatch:
  # regenerate on every push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVG (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF3CAC&color_dots=#ebedf0,#FFE50066,#FFE500,#FF8FD0,#FF3CAC
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF3CAC&color_dots=#161b22,#FFE50044,#FFE50099,#FF8FD0,#FF3CAC

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
